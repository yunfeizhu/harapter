name: Design proposal
description:
  Propose a public API, lifecycle, compatibility, or architecture change.
title: 'design: '
labels:
  - design
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description:
        Which provider APIs, fixtures, or host use cases demonstrate the need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description:
        Describe types, lifecycle, errors, capabilities, and compatibility
        impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description:
        Explain why an extension, native API, or provider-local change is
        insufficient.
    validations:
      required: true
  - type: textarea
    id: breaking
    attributes:
      label: Migration and breaking changes
      description: State whether existing consumers or providers must change.
