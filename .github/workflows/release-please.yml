name: Release Please

on:
  workflow_dispatch:
    inputs:
      resume_release_tag:
        description: Existing Release Please draft tag to finalize
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release pull request or draft
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-created:
        ${{ steps.release.outputs.release_created ||
        steps.resume.outputs.release_created }}
      release-sha: ${{ steps.release.outputs.sha || steps.resume.outputs.sha }}
      release-tag:
        ${{ steps.release.outputs.tag_name || steps.resume.outputs.tag_name }}
      release-version:
        ${{ steps.release.outputs.version || steps.resume.outputs.version }}
      release-resumed: ${{ steps.resume.outputs.release_resumed || 'false' }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        if: inputs.resume_release_tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Resolve existing Release Please draft
        id: resume
        if: inputs.resume_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RELEASE_TAG: ${{ inputs.resume_release_tag }}
        run: |
          [[ "$RESUME_RELEASE_TAG" =~ ^harapter-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release_version="${RESUME_RELEASE_TAG#harapter-v}"
          release_json="$(gh release view "$RESUME_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,isImmutable,targetCommitish,publishedAt)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RESUME_RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.isImmutable' <<<"$release_json")" = "false"
          test "$(jq -r '.publishedAt' <<<"$release_json")" = "null"

          release_sha="$(jq -r '.targetCommitish' <<<"$release_json")"
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
          compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$release_sha...$GITHUB_SHA")"
          compare_status="$(jq -r '.status' <<<"$compare_json")"
          if [[ "$compare_status" != 'ahead' && "$compare_status" != 'identical' ]]; then
            echo "The resumed release commit is not reachable from the dispatch commit." >&2
            exit 1
          fi
          tag_refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RESUME_RELEASE_TAG")"
          tag_ref_count="$(jq --arg ref "refs/tags/$RESUME_RELEASE_TAG" \
            '[.[] | select(.ref == $ref)] | length' <<<"$tag_refs")"
          test "$tag_ref_count" = '0'

          {
            echo 'release_created=true'
            echo 'release_resumed=true'
            echo "sha=$release_sha"
            echo "tag_name=$RESUME_RELEASE_TAG"
            echo "version=$release_version"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release pull request branch
        id: release-pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          node -e 'const fs = require("node:fs"); const pullRequest = JSON.parse(process.env.RELEASE_PR); const branch = pullRequest.headBranchName; const number = pullRequest.number; if (!/^release-please--[a-zA-Z0-9._/-]+$/.test(branch)) throw new Error("Release Please returned an invalid headBranchName"); if (!Number.isSafeInteger(number) || number < 1) throw new Error("Release Please returned an invalid pull request number"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `branch=${branch}\nnumber=${number}\n`);'

      - name: Run repository checks for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          pull_request_json="$(gh pr view "$RELEASE_NUMBER" --repo "$GITHUB_REPOSITORY" --json author,baseRefOid,body,headRefName,headRefOid,title)"
          pr_author="$(jq -r '.author.login' <<<"$pull_request_json")"
          pr_body="$(jq -r '.body // ""' <<<"$pull_request_json")"
          pr_branch="$(jq -r '.headRefName' <<<"$pull_request_json")"
          pr_title="$(jq -r '.title' <<<"$pull_request_json")"
          base_sha="$(jq -r '.baseRefOid' <<<"$pull_request_json")"
          head_sha="$(jq -r '.headRefOid' <<<"$pull_request_json")"
          test "$pr_branch" = "$RELEASE_BRANCH"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH" \
            -f pr_author="$pr_author" \
            -f pr_body="$pr_body" \
            -f pr_branch="$pr_branch" \
            -f pr_title="$pr_title" \
            -f base_sha="$base_sha" \
            -f head_sha="$head_sha"

  finalize-release:
    name: Publish verified GitHub Release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.release-sha }}

      - name: Verify release candidate
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
          RELEASE_RESUMED: ${{ needs.release-please.outputs.release-resumed }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_RESUMED" =~ ^(true|false)$ ]]
          if [[ "$RELEASE_RESUMED" = 'false' ]]; then
            test "$EXPECTED_RELEASE_SHA" = "$GITHUB_SHA"
          fi
          test "$RELEASE_TAG" = "harapter-v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release evidence
        run: pnpm check

      - name: Verify release package versions
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run:
          node scripts/publish-packages.mjs verify --version "$RELEASE_VERSION"

      - name: Build release assets
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          node scripts/build-release-assets.mjs \
            --version "$RELEASE_VERSION" \
            --output-dir release-assets \
            --release-sha "$RELEASE_SHA"

      - name: Inspect release state
        id: release-state
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,tagName,isDraft,isPrerelease,isImmutable,targetCommitish,publishedAt)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.targetCommitish' <<<"$release_json")" = "$EXPECTED_RELEASE_SHA"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"

          release_id="$(jq -r '.databaseId' <<<"$release_json")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

          draft="$(jq -r '.isDraft' <<<"$release_json")"
          if [[ "$draft" = 'true' ]]; then
            test "$(jq -r '.isImmutable' <<<"$release_json")" = "false"
            test "$(jq -r '.publishedAt' <<<"$release_json")" = "null"
            tag_refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
            tag_ref_count="$(jq --arg ref "refs/tags/$RELEASE_TAG" \
              '[.[] | select(.ref == $ref)] | length' <<<"$tag_refs")"
            test "$tag_ref_count" = '0'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$draft" = 'false'
          test "$(jq -r '.isImmutable' <<<"$release_json")" = "true"
          test "$(jq -r '.publishedAt' <<<"$release_json")" != "null"
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          for _ in 1 2; do
            if [[ "$object_type" != 'tag' ]]; then
              break
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done
          test "$object_type" = 'commit'
          test "$object_sha" = "$EXPECTED_RELEASE_SHA"
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Upload missing release assets
        if: steps.release-state.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-state.outputs.release-id }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          for asset_path in release-assets/*; do
            asset_name="${asset_path##*/}"
            local_digest="sha256:$(sha256sum "$asset_path" | cut -d ' ' -f 1)"
            matches="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            if [[ "$matches" = '0' ]]; then
              gh release upload "$RELEASE_TAG" "$asset_path" \
                --repo "$GITHUB_REPOSITORY"
              release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
              continue
            fi
            test "$matches" = '1'
            remote_digest="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$remote_digest" = "$local_digest"
          done

      - name: Verify uploaded release assets
        if: steps.release-state.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-state.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/release.json"
          node scripts/verify-release-assets.mjs \
            --version "$RELEASE_VERSION" \
            --assets-dir release-assets \
            --release-sha "$RELEASE_SHA" \
            --release-json "$RUNNER_TEMP/release.json"

      - name: Publish immutable release
        if: steps.release-state.outputs.published == 'false'
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-state.outputs.release-id }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --method PATCH \
            -F draft=false)"
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$EXPECTED_RELEASE_SHA"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"

      - name: Verify immutable release
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          immutable='false'
          for _ in {1..12}; do
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
            immutable="$(jq -r '.immutable' <<<"$release_json")"
            if [[ "$immutable" = 'true' ]]; then
              break
            fi
            sleep 5
          done
          test "$immutable" = "true"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.published_at' <<<"$release_json")" != "null"

          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          for _ in 1 2; do
            if [[ "$object_type" != "tag" ]]; then
              break
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done
          test "$object_type" = "commit"
          test "$object_sha" = "$EXPECTED_RELEASE_SHA"

          printf '%s\n' "$release_json" > "$RUNNER_TEMP/release.json"
          node scripts/verify-release-assets.mjs \
            --version "$RELEASE_VERSION" \
            --assets-dir release-assets \
            --release-sha "$EXPECTED_RELEASE_SHA" \
            --release-json "$RUNNER_TEMP/release.json"
