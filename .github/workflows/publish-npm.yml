name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description:
          Existing non-draft GitHub Release tag, such as harapter-v0.1.0
        required: true
        type: string
      bootstrap:
        description:
          Use the one-time npm package-creation credential for package version
          0.1.1
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve published release tag
        id: release
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^harapter-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release_tag must be an exact Harapter stable release tag." >&2
            exit 1
          fi
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.immutable' <<<"$release_json")" = "true"
          test "$(jq -r '.published_at' <<<"$release_json")" != "null"

          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          for _ in 1 2; do
            if [[ "$object_type" != "tag" ]]; then
              break
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done
          test "$object_type" = "commit"
          [[ "$object_sha" =~ ^[a-f0-9]{40}$ ]]
          test "$object_sha" = "$EXPECTED_RELEASE_SHA"

          echo "sha=$object_sha" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#harapter-v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish verified tarballs
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release evidence
        run: pnpm check

      - name: Download immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - name: Verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json"
          node scripts/verify-release-assets.mjs \
            --version "$RELEASE_VERSION" \
            --assets-dir release-assets \
            --release-sha "$RELEASE_SHA" \
            --release-json "$RUNNER_TEMP/release.json"

      - name: Verify release package versions
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run:
          node scripts/publish-packages.mjs verify --version "$RELEASE_VERSION"

      - name: Publish first npm release with bootstrap credential
        if: inputs.bootstrap
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          node scripts/publish-packages.mjs publish \
            --version "$RELEASE_VERSION" \
            --artifacts-dir release-assets \
            --bootstrap

      - name: Publish npm release with trusted publishing
        if: ${{ !inputs.bootstrap }}
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          node scripts/publish-packages.mjs publish \
            --version "$RELEASE_VERSION" \
            --artifacts-dir release-assets
