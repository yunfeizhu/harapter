name: Provider live canary

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      provider:
        description: Provider runtime to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - codex
          - opencode
          - dsh
          - hermes
          - openclaw
          - pi

permissions:
  contents: read

concurrency:
  group: provider-live-canary
  cancel-in-progress: false

jobs:
  selection:
    name: Select trusted live canaries
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      codex: ${{ steps.providers.outputs.codex }}
      dsh: ${{ steps.providers.outputs.dsh }}
      hermes: ${{ steps.providers.outputs.hermes }}
      openclaw: ${{ steps.providers.outputs.openclaw }}
      opencode: ${{ steps.providers.outputs.opencode }}
      pi: ${{ steps.providers.outputs.pi }}
    steps:
      - name: Verify trusted default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Select provider jobs
        id: providers
        env:
          CODEX_ENABLED: ${{ vars.HARAPTER_LIVE_CODEX_ENABLED }}
          DSH_ENABLED: ${{ vars.HARAPTER_LIVE_DSH_ENABLED }}
          HERMES_ENABLED: ${{ vars.HARAPTER_LIVE_HERMES_ENABLED }}
          OPENCLAW_ENABLED: ${{ vars.HARAPTER_LIVE_OPENCLAW_ENABLED }}
          OPENCODE_ENABLED: ${{ vars.HARAPTER_LIVE_OPENCODE_ENABLED }}
          PI_ENABLED: ${{ vars.HARAPTER_LIVE_PI_ENABLED }}
          REQUESTED_PROVIDER: ${{ inputs.provider }}
        run: |
          set -eu

          validate_flag() {
            case "$2" in
              ''|true|false) ;;
              *)
                echo "::error title=Invalid live-canary variable::$1 must be true or false."
                exit 1
                ;;
            esac
          }

          validate_flag HARAPTER_LIVE_CODEX_ENABLED "$CODEX_ENABLED"
          validate_flag HARAPTER_LIVE_DSH_ENABLED "$DSH_ENABLED"
          validate_flag HARAPTER_LIVE_HERMES_ENABLED "$HERMES_ENABLED"
          validate_flag HARAPTER_LIVE_OPENCLAW_ENABLED "$OPENCLAW_ENABLED"
          validate_flag HARAPTER_LIVE_OPENCODE_ENABLED "$OPENCODE_ENABLED"
          validate_flag HARAPTER_LIVE_PI_ENABLED "$PI_ENABLED"

          codex=false
          dsh=false
          hermes=false
          openclaw=false
          opencode=false
          pi=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            [ "$CODEX_ENABLED" = true ] && codex=true
            [ "$DSH_ENABLED" = true ] && dsh=true
            [ "$HERMES_ENABLED" = true ] && hermes=true
            [ "$OPENCLAW_ENABLED" = true ] && openclaw=true
            [ "$OPENCODE_ENABLED" = true ] && opencode=true
            [ "$PI_ENABLED" = true ] && pi=true
          else
            case "$REQUESTED_PROVIDER" in
              all) codex=true; dsh=true; hermes=true; openclaw=true; opencode=true; pi=true ;;
              codex) codex=true ;;
              dsh) dsh=true ;;
              hermes) hermes=true ;;
              openclaw) openclaw=true ;;
              opencode) opencode=true ;;
              pi) pi=true ;;
              *)
                echo "::error title=Invalid live-canary selection::Select one listed Provider."
                exit 1
                ;;
            esac
          fi

          if [ "$codex" = false ] && [ "$dsh" = false ] && [ "$hermes" = false ] && [ "$openclaw" = false ] && [ "$opencode" = false ] && [ "$pi" = false ]; then
            echo "::error title=No scheduled live canary enabled::Enable at least one Provider repository variable."
            exit 1
          fi

          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "dsh=$dsh" >> "$GITHUB_OUTPUT"
          echo "hermes=$hermes" >> "$GITHUB_OUTPUT"
          echo "openclaw=$openclaw" >> "$GITHUB_OUTPUT"
          echo "opencode=$opencode" >> "$GITHUB_OUTPUT"
          echo "pi=$pi" >> "$GITHUB_OUTPUT"

  codex:
    name: Codex latest live lifecycle
    needs: selection
    if: needs.selection.outputs.codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Harapter dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current Codex release
        run: npm install --global @openai/codex@latest

      - name: Record Codex runtime identity
        run: |
          printf '%s\n' '### Codex live canary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Harapter revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/prepare-live-canary.mjs record-global-package Runtime @openai/codex

      - name: Verify Codex model-facing surface
        env:
          CODEX_HOME: ${{ runner.temp }}/harapter-codex-safety-home
          HARAPTER_LIVE_MODEL_API_KEY: unused-canary-safety-value
          HARAPTER_LIVE_MODEL_ID: harapter-live-safety-check
          HARAPTER_LIVE_MODEL_URL: https://model.invalid/v1
        run: |
          node scripts/prepare-live-canary.mjs write-codex-config "$CODEX_HOME/config.toml"
          codex features list > "$RUNNER_TEMP/codex-features.txt"
          node scripts/prepare-live-canary.mjs validate-codex-features "$RUNNER_TEMP/codex-features.txt"

      - name: Validate live configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: node scripts/prepare-live-canary.mjs validate

      - name: Prepare isolated Codex live configuration
        env:
          CODEX_HOME: ${{ runner.temp }}/harapter-codex-home
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: |
          node scripts/prepare-live-canary.mjs write-codex-config "$CODEX_HOME/config.toml"

      - name: Run Codex live lifecycle
        env:
          CODEX_HOME: ${{ runner.temp }}/harapter-codex-home
          HARAPTER_CODEX_LIVE: '1'
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
        run: |
          set -eu
          codex_command=$(command -v codex)
          case "$codex_command" in
            /*) ;;
            *)
              echo "::error title=Invalid Codex command::The installed CLI path must be absolute."
              exit 1
              ;;
          esac
          HARAPTER_CODEX_COMMAND="$codex_command" timeout --signal=TERM --kill-after=10s 300s pnpm vitest run providers/codex/test/live.test.ts

      - name: Record passing Codex evidence
        run: |
          printf '%s\n' '- Lifecycle: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Synthetic Prompts submitted: 2' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Completed message Event: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Session resume: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Native cancellation: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Authoritative terminals: run.completed, run.cancelled' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Model tools enabled: 0' >> "$GITHUB_STEP_SUMMARY"

  opencode:
    name: OpenCode latest live lifecycle
    needs: selection
    if: needs.selection.outputs.opencode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Harapter dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate live configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: node scripts/prepare-live-canary.mjs validate

      - name: Install current OpenCode release
        run: npm install --global opencode-ai@latest

      - name: Record OpenCode runtime identity
        run: |
          printf '%s\n' '### OpenCode live canary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Harapter revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/prepare-live-canary.mjs record-global-package Runtime opencode-ai

      - name: Prepare isolated OpenCode configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
          OPENCODE_CONFIG: ${{ runner.temp }}/harapter-opencode.json
        run: |
          node scripts/prepare-live-canary.mjs write-opencode-config "$OPENCODE_CONFIG"

      - name: Run OpenCode live lifecycle
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
          HARAPTER_OPENCODE_ENDPOINT: http://127.0.0.1:4096
          HARAPTER_OPENCODE_LIVE: '1'
          HARAPTER_OPENCODE_MODEL: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_OPENCODE_MODEL_PROVIDER: harapter-live
          OPENCODE_CONFIG: ${{ runner.temp }}/harapter-opencode.json
        run: |
          set -eu
          opencode serve --hostname 127.0.0.1 --port 4096 > "$RUNNER_TEMP/opencode-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _attempt in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 --fail --silent --show-error --output /dev/null http://127.0.0.1:4096/global/health; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error title=OpenCode startup failed::The isolated server exited before readiness."
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error title=OpenCode startup timed out::The isolated server did not become ready."
            exit 1
          fi

          timeout --signal=TERM --kill-after=10s 180s pnpm vitest run providers/opencode/test/live.test.ts

      - name: Record passing OpenCode evidence
        run: |
          printf '%s\n' '- Lifecycle: passed' >> "$GITHUB_STEP_SUMMARY"

  dsh:
    name: DSH current SDK Profile live lifecycle
    needs: selection
    if: needs.selection.outputs.dsh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Harapter dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current DSH SDK Profile release
        run: npm install --global @deepseek-ai/dsh@alpha

      - name: Record DSH runtime identity
        run: |
          printf '%s\n' '### DSH live canary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Harapter revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/prepare-live-canary.mjs record-global-package CLI @deepseek-ai/dsh
          node scripts/prepare-live-canary.mjs record-global-package 'SDK Profile' @deepseek-ai/dsh-sdk-minimal @deepseek-ai/dsh
          node scripts/prepare-live-canary.mjs record-global-package 'SDK Runtime' @deepseek-ai/dsh-sdk-app @deepseek-ai/dsh

      - name: Verify DSH model-facing surface
        env:
          DSH_HOME: ${{ runner.temp }}/harapter-dsh-safety-home
          DSH_TELEMETRY_DISABLED: '1'
          HARAPTER_LIVE_MODEL_ID: harapter-live-safety-check
          HARAPTER_LIVE_MODEL_URL: https://model.invalid/v1
        run: |
          dsh --profile sdk-minimal --patch "${{ github.workspace }}/.github/live/dsh-model.cordis.patch.yml" --dump-config > "$RUNNER_TEMP/dsh-effective-config.yml"
          node scripts/prepare-live-canary.mjs validate-dsh-config "$RUNNER_TEMP/dsh-effective-config.yml"

      - name: Validate live configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: node scripts/prepare-live-canary.mjs validate

      - name: Run DSH live lifecycle
        env:
          DSH_HOME: ${{ runner.temp }}/harapter-dsh-home
          DSH_PERMISSION_MODE: read-only
          DSH_TELEMETRY_DISABLED: '1'
          HARAPTER_DSH_ARGS_JSON: >-
            ["--profile","sdk-minimal","--patch","${{ github.workspace
            }}/.github/live/dsh-model.cordis.patch.yml"]
          HARAPTER_DSH_LIVE: '1'
          HARAPTER_DSH_MODEL: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_DSH_PROVIDER: harapter-live
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run:
          timeout --signal=TERM --kill-after=10s 180s pnpm vitest run
          providers/dsh/test/live.test.ts

      - name: Record passing DSH evidence
        run: |
          printf '%s\n' '- Lifecycle: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Prompt submitted: yes' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Completed message Event: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Authoritative terminal: run.completed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Model tools enabled: 0' >> "$GITHUB_STEP_SUMMARY"

  hermes:
    name: Hermes Agent latest live lifecycle
    needs: selection
    if: needs.selection.outputs.hermes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Harapter dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current Hermes Agent release
        run: docker pull nousresearch/hermes-agent:latest

      - name: Record Hermes Agent runtime identity
        run: |
          set -eu
          hermes_image_id=$(docker image inspect --format '{{.Id}}' nousresearch/hermes-agent:latest)
          hermes_image_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$hermes_image_id")
          hermes_probe_container="harapter-hermes-version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_hermes_probe() {
            docker rm --force "$hermes_probe_container" >/dev/null 2>&1 || true
          }
          trap cleanup_hermes_probe EXIT
          hermes_version=$(timeout --signal=TERM --kill-after=5s 30s docker run --rm --name "$hermes_probe_container" --entrypoint /opt/hermes/.venv/bin/python "$hermes_image_id" -c "from importlib.metadata import version; print(version('hermes-agent'))")
          cleanup_hermes_probe
          trap - EXIT
          printf '%s\n' '### Hermes Agent live canary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Harapter revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/prepare-live-canary.mjs record-container-package Runtime hermes-agent "$hermes_version" "$hermes_image_digest"

      - name: Validate live configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: node scripts/prepare-live-canary.mjs validate

      - name: Prepare isolated Hermes Agent configuration
        env:
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: |
          set -eu
          HERMES_DATA_DIR="$RUNNER_TEMP/harapter-hermes-data"
          node scripts/prepare-live-canary.mjs write-hermes-config "$HERMES_DATA_DIR/config.yaml"
          touch "$HERMES_DATA_DIR/.no-bundled-skills"
          chmod 600 "$HERMES_DATA_DIR/.no-bundled-skills"

      - name: Run Hermes Agent live lifecycle
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
        run: |
          set -eu
          HERMES_CONTAINER="harapter-hermes-live-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          HERMES_DATA_DIR="$RUNNER_TEMP/harapter-hermes-data"
          HERMES_IMAGE_ID=$(docker image inspect --format '{{.Id}}' nousresearch/hermes-agent:latest)
          hermes_api_key=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")
          cleanup_hermes() {
            docker stop --time 5 "$HERMES_CONTAINER" >/dev/null 2>&1 || true
            docker rm --force "$HERMES_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_hermes EXIT

          docker run --detach \
            --name "$HERMES_CONTAINER" \
            --publish 127.0.0.1:8642:8642 \
            --mount type=bind,src="$HERMES_DATA_DIR",dst=/opt/data \
            --workdir /opt/data \
            --env API_SERVER_ENABLED=true \
            --env API_SERVER_HOST=0.0.0.0 \
            --env API_SERVER_PORT=8642 \
            --env API_SERVER_KEY="$hermes_api_key" \
            --env HARAPTER_LIVE_MODEL_API_KEY \
            --env HERMES_GATEWAY_NO_SUPERVISE=1 \
            --env HERMES_UID="$(id -u)" \
            --env HERMES_GID="$(id -g)" \
            "$HERMES_IMAGE_ID" gateway run --no-supervise >/dev/null
          unset HARAPTER_LIVE_MODEL_API_KEY

          ready=false
          for _attempt in $(seq 1 60); do
            if curl --connect-timeout 1 --max-time 3 --fail --silent --output "$RUNNER_TEMP/hermes-capabilities.json" --header "Authorization: Bearer $hermes_api_key" http://127.0.0.1:8642/v1/capabilities; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$HERMES_CONTAINER" 2>/dev/null || true)" != true ]; then
              echo '::error title=Hermes Agent startup failed::The isolated container exited before readiness.'
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo '::error title=Hermes Agent startup timed out::The isolated API Server did not become ready.'
            exit 1
          fi

          curl --connect-timeout 1 --max-time 5 --fail --silent --output "$RUNNER_TEMP/hermes-toolsets.json" --header "Authorization: Bearer $hermes_api_key" http://127.0.0.1:8642/v1/toolsets
          node scripts/prepare-live-canary.mjs validate-hermes-toolsets "$RUNNER_TEMP/hermes-toolsets.json"
          timeout --signal=TERM --kill-after=5s 30s docker exec "$HERMES_CONTAINER" /opt/hermes/.venv/bin/python -c "import json; from gateway.run import _load_gateway_config; from hermes_cli.tools_config import _get_platform_tools; print(json.dumps(sorted(_get_platform_tools(_load_gateway_config(), 'api_server'))))" > "$RUNNER_TEMP/hermes-enabled-toolsets.json"
          node scripts/prepare-live-canary.mjs validate-hermes-enabled-toolsets "$RUNNER_TEMP/hermes-enabled-toolsets.json"

          HARAPTER_HERMES_API_KEY="$hermes_api_key" \
            HARAPTER_HERMES_ENDPOINT=http://127.0.0.1:8642/ \
            HARAPTER_HERMES_LIVE=1 \
            timeout --signal=TERM --kill-after=10s 300s pnpm vitest run providers/hermes/test/live.test.ts

      - name: Record passing Hermes Agent evidence
        run: |
          printf '%s\n' '- Lifecycle: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Prompt submitted: yes' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Completed message Event: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Session resume: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Native cancellation: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Authoritative terminals: run.completed, run.cancelled' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Model toolsets enabled: 0' >> "$GITHUB_STEP_SUMMARY"

  pi:
    name: Pi Agent latest live lifecycle
    needs: selection
    if: needs.selection.outputs.pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Harapter dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current Pi Agent release
        run:
          npm install --global --ignore-scripts
          @earendil-works/pi-coding-agent@latest

      - name: Record Pi Agent runtime identity
        run: |
          printf '%s\n' '### Pi Agent live canary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Harapter revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/prepare-live-canary.mjs record-global-package Runtime @earendil-works/pi-coding-agent

      - name: Verify Pi Agent model-facing surface
        env:
          HARAPTER_LIVE_MODEL_API_KEY: unused-canary-safety-value
          HARAPTER_LIVE_MODEL_ID: harapter-live-safety-check
          HARAPTER_LIVE_MODEL_URL: https://model.invalid/v1
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/harapter-pi-safety-home
          PI_CODING_AGENT_SESSION_DIR:
            ${{ runner.temp }}/harapter-pi-safety-sessions
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
        run: |
          set -eu
          mkdir -p "$PI_CODING_AGENT_DIR" "$PI_CODING_AGENT_SESSION_DIR"
          node scripts/prepare-live-canary.mjs write-pi-config "$PI_CODING_AGENT_DIR/models.json"
          timeout --signal=TERM --kill-after=5s 30s pi --no-tools --no-context-files --help > "$RUNNER_TEMP/pi-help.txt"
          grep --fixed-strings -- '--no-tools' "$RUNNER_TEMP/pi-help.txt" >/dev/null
          grep --fixed-strings -- '--no-context-files' "$RUNNER_TEMP/pi-help.txt" >/dev/null
          timeout --signal=TERM --kill-after=5s 30s pi --no-tools --no-context-files --list-models harapter-live > "$RUNNER_TEMP/pi-models.txt"
          grep --fixed-strings -- 'harapter-live-safety-check' "$RUNNER_TEMP/pi-models.txt" >/dev/null

      - name: Validate live configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: node scripts/prepare-live-canary.mjs validate

      - name: Prepare isolated Pi Agent configuration
        env:
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: |
          mkdir -p "${{ runner.temp }}/harapter-pi-home"
          node scripts/prepare-live-canary.mjs write-pi-config "${{ runner.temp }}/harapter-pi-home/models.json"

      - name: Run Pi Agent live lifecycle
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_PI_LIVE: '1'
          HARAPTER_PI_MODEL: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/harapter-pi-home
          PI_CODING_AGENT_SESSION_DIR: ${{ runner.temp }}/harapter-pi-sessions
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
        run: |
          set -eu
          mkdir -p "$PI_CODING_AGENT_DIR" "$PI_CODING_AGENT_SESSION_DIR"
          pi_command=$(command -v pi)
          case "$pi_command" in
            /*) ;;
            *)
              echo "::error title=Invalid Pi Agent command::The installed CLI path must be absolute."
              exit 1
              ;;
          esac
          HARAPTER_PI_COMMAND="$pi_command" timeout --signal=TERM --kill-after=10s 300s pnpm vitest run providers/pi/test/live.test.ts

      - name: Record passing Pi Agent evidence
        run: |
          printf '%s\n' '- Lifecycle: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Prompt submitted: yes' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Session resume: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Native cancellation: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Model tools enabled: 0' >> "$GITHUB_STEP_SUMMARY"

  openclaw:
    name: OpenClaw latest live lifecycle
    needs: selection
    if: needs.selection.outputs.openclaw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install Harapter dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current OpenClaw release
        run: npm install --global --ignore-scripts openclaw@latest

      - name: Record OpenClaw runtime identity
        run: |
          printf '%s\n' '### OpenClaw live canary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Harapter revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node scripts/prepare-live-canary.mjs record-global-package Runtime openclaw

      - name: Validate live configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
        run: node scripts/prepare-live-canary.mjs validate

      - name: Prepare isolated OpenClaw configuration
        env:
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_LIVE_MODEL_ID: ${{ secrets.HARAPTER_LIVE_MODEL_ID }}
          HARAPTER_LIVE_MODEL_URL: ${{ secrets.HARAPTER_LIVE_MODEL_URL }}
          OPENCLAW_CONFIG_PATH:
            ${{ runner.temp }}/harapter-openclaw-state/openclaw.json
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/harapter-openclaw-state
          TMPDIR: ${{ runner.temp }}/harapter-openclaw-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/harapter-openclaw-cache
        run: |
          node scripts/prepare-live-canary.mjs write-openclaw-config "$OPENCLAW_CONFIG_PATH" "$RUNNER_TEMP/harapter-openclaw-workspace" "$RUNNER_TEMP/harapter-openclaw.log"
          openclaw config validate

      - name: Run OpenClaw live lifecycle
        env:
          DO_NOT_TRACK: '1'
          HARAPTER_LIVE_MODEL_API_KEY:
            ${{ secrets.HARAPTER_LIVE_MODEL_API_KEY }}
          HARAPTER_OPENCLAW_LIVE: '1'
          OPENCLAW_CONFIG_PATH:
            ${{ runner.temp }}/harapter-openclaw-state/openclaw.json
          OPENCLAW_DISABLE_BONJOUR: '1'
          OPENCLAW_GATEWAY_PORT: '18961'
          OPENCLAW_LOAD_SHELL_ENV: '0'
          OPENCLAW_NO_AUTO_UPDATE: '1'
          OPENCLAW_NO_RESPAWN: '1'
          OPENCLAW_OFFLINE: '1'
          OPENCLAW_SKIP_BROWSER_CONTROL_SERVER: '1'
          OPENCLAW_SKIP_CANVAS_HOST: '1'
          OPENCLAW_SKIP_CHANNELS: '1'
          OPENCLAW_SKIP_CRON: '1'
          OPENCLAW_SKIP_GMAIL_WATCHER: '1'
          OPENCLAW_SKIP_PROVIDERS: '1'
          OPENCLAW_SKIP_STARTUP_MODEL_PREWARM: '1'
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/harapter-openclaw-state
          TMPDIR: ${{ runner.temp }}/harapter-openclaw-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/harapter-openclaw-cache
        run: |
          set -eu
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" "$RUNNER_TEMP/harapter-openclaw-workspace"
          openclaw_command=$(command -v openclaw)
          case "$openclaw_command" in
            /*) ;;
            *)
              echo "::error title=Invalid OpenClaw command::The installed CLI path must be absolute."
              exit 1
              ;;
          esac
          OPENCLAW_GATEWAY_TOKEN=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")
          export OPENCLAW_GATEWAY_TOKEN
          "$openclaw_command" gateway run --port "$OPENCLAW_GATEWAY_PORT" --bind loopback --auth token > "$RUNNER_TEMP/openclaw-gateway-stdout.log" 2>&1 &
          gateway_pid=$!
          cleanup_gateway() {
            kill "$gateway_pid" 2>/dev/null || true
            cleanup_attempt=0
            while kill -0 "$gateway_pid" 2>/dev/null && [ "$cleanup_attempt" -lt 5 ]; do
              cleanup_attempt=$((cleanup_attempt + 1))
              sleep 1
            done
            if kill -0 "$gateway_pid" 2>/dev/null; then
              kill -KILL "$gateway_pid" 2>/dev/null || true
            fi
            wait "$gateway_pid" 2>/dev/null || true
          }
          trap cleanup_gateway EXIT

          ready=false
          for _attempt in $(seq 1 45); do
            if timeout --signal=TERM --kill-after=2s 5s "$openclaw_command" health --json --timeout 2000 > "$RUNNER_TEMP/openclaw-health.json" 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              echo "::error title=OpenClaw startup failed::The isolated Gateway exited before readiness."
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error title=OpenClaw startup timed out::The isolated Gateway did not become ready."
            exit 1
          fi

          unset HARAPTER_LIVE_MODEL_API_KEY
          HARAPTER_OPENCLAW_COMMAND="$openclaw_command" timeout --signal=TERM --kill-after=10s 240s pnpm vitest run providers/openclaw/test/live.test.ts

      - name: Record passing OpenClaw evidence
        run: |
          printf '%s\n' '- Lifecycle: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Synthetic Prompts submitted: 2' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Completed message Event: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Session resume: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Native cancellation: passed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Authoritative terminals: run.completed, run.cancelled' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Model tools enabled: no' >> "$GITHUB_STEP_SUMMARY"
